<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d0b14" />
    <!-- the game is already dark: keep Dark Reader and similar extensions from repainting it -->
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="only light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Punchcard" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Punchcard: a real-time deckbuilding roguelike on a conveyor belt. A fantasy adventure worked as a factory shift: play your cards before they slip off the belt."
    />
    <!-- link previews (chats, social): crawlers need absolute URLs, so these point at the published site -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lucaliver.github.io/liverstone-plus/" />
    <meta property="og:title" content="Punchcard — a deckbuilder on the clock" />
    <meta property="og:description" content="A real-time deckbuilding roguelike on a conveyor belt. Clock in, play fast, get paid (not really)." />
    <meta property="og:image" content="https://lucaliver.github.io/liverstone-plus/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lucaliver.github.io/liverstone-plus/og.png" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Punchcard</title>
  </head>
  <body>
    <main id="app"></main>
    <noscript>Punchcard needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
