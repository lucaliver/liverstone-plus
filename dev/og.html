<!doctype html><html><head><meta charset="utf-8"><title>og</title>
<style>
body { margin: 0; background: var(--void); }
/* the link preview: 1200x630, built from the game's own sprites, cards and tokens (dev server: /dev/og.html) */
#og { position: relative; width: 1200px; height: 630px; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--night-dot) 2px, transparent 2.5px); background-size: 14px 14px; }
.og-band { position: absolute; inset: 0; background: var(--y); clip-path: polygon(0 20%, 100% 4%, 100% 36%, 0 52%); }
#og .og-logo { margin: 0; padding: 12px 34px 20px; font-size: 124px; line-height: 1; letter-spacing: 6px; color: var(--k); background: var(--paper); border: 8px solid var(--k); box-shadow: 12px 12px 0 var(--p); text-shadow: 6px 6px 0 var(--p); animation: none; white-space: nowrap; }
.og-sign { position: absolute; left: 50%; top: 52px; translate: -50% 0; rotate: -4deg; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.og-tag { padding: 8px 22px; font: 700 30px/1 var(--font-display); letter-spacing: 3px; text-transform: uppercase; color: var(--paper); background: var(--k); white-space: nowrap; }
.og-who { position: absolute; width: 270px; height: 270px; }
.og-who .riso { width: 100%; height: 100%; }
.og-shadow { position: absolute; height: 22px; background: var(--k); opacity: 0.55; border-radius: 50%; }
.og-hand { position: absolute; left: 50%; bottom: 26px; display: flex; translate: -50% 0; }
.og-hand .card { --cw: 104px; margin: 0 -12px; transform-origin: 50% 120%; }
.vs { position: absolute; left: 50%; top: 330px; translate: -50% 0; font: 44px/1 var(--font-ui); color: var(--p); }
</style></head><body><div id="og">
<div class="og-band"></div>
<div class="og-sign"><h1 class="logo og-logo">PUNCHCARD</h1><div class="og-tag">A deckbuilder on the clock</div></div>
<div id="stage"></div>
</div>
<script type="module">
import '/src/styles/index.css';
import { preloadArt, sprite } from '/src/ui/art/riso.ts';
import { CREATURES } from '/src/ui/art/creatures.ts';
import { ICONS } from '/src/ui/art/icons.ts';
import { cardView } from '/src/ui/components/cardView.ts';
await preloadArt({ creatures: CREATURES, icons: ICONS });
await Promise.all([document.fonts.load('700 100px Silkscreen'), document.fonts.load('30px Jersey')]);
await document.fonts.ready;
// feet on the bottom edge: the sprite's own shadow sits ~5% above the bottom of its box
const who = (id, x, size, flip = false) => `<div class="og-who" style="left:${x}px;top:${632 - size * 0.95}px;width:${size}px;height:${size}px;${flip ? 'scale:-1 1' : ''}">${sprite(id)}</div>`;
// heroes on the left facing the coworkers on the right
document.getElementById('stage').innerHTML = [
  who('necromancer', -40, 260),
  who('warrior', 75, 295),
  who('mage', 215, 255),
  who('toxicCoworker', 735, 255, true),
  who('hrBitch', 850, 295, true),
  who('slavesCeo', 960, 320, true),
].join('');
const hand = document.createElement('div');
hand.className = 'og-hand';
const cards = ['crowbar', 'rust', 'youShallNotPass', 'picketDrums', 'slagBall'];
cards.forEach((id, i) => {
  const c = cardView({ uid: i, id, up: i === 1 || i === 3 });
  const k = i - (cards.length - 1) / 2;
  c.style.rotate = `${k * 8}deg`;
  c.style.translate = `0 ${Math.abs(k) * 10}px`;
  hand.append(c);
});
document.getElementById('og').append(hand);
document.title = 'ready';
</script></body></html>
